<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #525659; overflow-y: auto; overflow-x: hidden; }
  .page-wrap { position: relative; margin: 2px auto; background: white; }
  .page-wrap canvas { display: block; }
  .link-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; }
  .link-layer a {
    position: absolute; display: block; cursor: pointer;
    border-radius: 2px;
  }
  .link-layer a:hover { background: rgba(255, 255, 0, 0.25); }
  #loading { color: #ccc; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding-top: 40px; font-size: 14px; }
  #error { color: #f88; font-family: system-ui; text-align: center; padding: 40px 20px; font-size: 14px; }
  #error a { color: #667eea; }
</style>
</head>
<body>
<div id="loading">Loading CV...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
<script>
(function() {
  // Create same-origin worker via importScripts (avoids cross-origin Worker restriction)
  try {
    var workerUrl = URL.createObjectURL(new Blob(
      ['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js")'],
      { type: 'text/javascript' }
    ));
    pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
  } catch (e) {
    console.warn('CV viewer: worker setup failed, using main thread', e);
  }

  var pdfUrl = new URLSearchParams(location.search).get('pdf');
  if (!pdfUrl) {
    showError('No PDF URL provided.');
    return;
  }

  console.log('CV viewer: loading', pdfUrl);

  renderPdf(pdfUrl).catch(function(err) {
    console.error('CV viewer error:', err);
    showError('Could not render PDF. <a href="' + pdfUrl + '" target="_blank">Open directly</a>');
  });

  function showError(html) {
    document.getElementById('loading').style.display = 'none';
    var div = document.createElement('div');
    div.id = 'error';
    div.innerHTML = html;
    document.body.appendChild(div);
  }

  async function renderPdf(url) {
    var loadingTask = pdfjsLib.getDocument(url);
    var pdf = await loadingTask.promise;
    document.getElementById('loading').style.display = 'none';

    var containerWidth = document.body.clientWidth;
    console.log('CV viewer: rendering ' + pdf.numPages + ' pages, container width: ' + containerWidth);

    for (var i = 1; i <= pdf.numPages; i++) {
      var page = await pdf.getPage(i);

      // Compute scale to fit container width
      var unscaledViewport = page.getViewport({ scale: 1 });
      var scale = containerWidth / unscaledViewport.width;
      var viewport = page.getViewport({ scale: scale });

      // Page wrapper
      var wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      wrap.style.width = Math.floor(viewport.width) + 'px';
      wrap.style.height = Math.floor(viewport.height) + 'px';

      // Canvas — use official PDF.js HiDPI pattern with transform param
      var canvas = document.createElement('canvas');
      var outputScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';

      var ctx = canvas.getContext('2d');
      var transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
      await page.render({
        canvasContext: ctx,
        transform: transform,
        viewport: viewport
      }).promise;
      wrap.appendChild(canvas);

      // Annotation / link layer
      var linkLayer = document.createElement('div');
      linkLayer.className = 'link-layer';

      var annotations = await page.getAnnotations({ intent: 'display' });
      var linkCount = 0;

      for (var j = 0; j < annotations.length; j++) {
        var ann = annotations[j];
        if (ann.subtype !== 'Link') continue;

        var linkUrl = ann.url || ann.unsafeUrl;
        if (!linkUrl) continue;

        // Use PDF.js built-in coordinate conversion
        var viewRect = viewport.convertToViewportRectangle(ann.rect);
        var left = Math.min(viewRect[0], viewRect[2]);
        var top = Math.min(viewRect[1], viewRect[3]);
        var width = Math.abs(viewRect[2] - viewRect[0]);
        var height = Math.abs(viewRect[3] - viewRect[1]);

        // Skip degenerate rects
        if (width < 1 || height < 1) continue;

        var a = document.createElement('a');
        a.href = linkUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.left = left + 'px';
        a.style.top = top + 'px';
        a.style.width = width + 'px';
        a.style.height = height + 'px';
        a.title = linkUrl;
        linkLayer.appendChild(a);
        linkCount++;
      }

      console.log('CV viewer: page ' + i + ' — ' + annotations.length + ' annotations, ' + linkCount + ' links rendered');

      wrap.appendChild(linkLayer);
      document.body.appendChild(wrap);
    }
  }
})();
</script>
</body>
</html>
